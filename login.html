<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">RestoApp</span>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="pedido.html">Tomar pedido</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h2>Acceso al sistema</h2>

    <form id="loginForm" class="card">
      <div class="form-row">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Ingresar</button>
      <div id="mensaje" class="msg" role="alert"></div>
    </form>

    <p class="hint">
      El acceso usa Firebase Authentication (correo/contraseña).
      Consulta <code>CHANGELOG.md</code> para la configuración inicial
      del proyecto Firebase y la creación del usuario administrador.
    </p>
  </main>

  <script type="module" src="js/login-page.js"></script>
</body>
</html>

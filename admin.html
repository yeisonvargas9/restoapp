<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Administración</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">RestoApp</span>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="pedido.html">Tomar pedido</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h2>Panel de administración</h2>
    <p>
      Sesión: <strong id="userLabel">cargando…</strong>
      <button id="logoutBtn" class="btn btn-secondary">Cerrar sesión</button>
    </p>

    <div class="card">
      <h3>Crear producto</h3>
      <form id="productForm">
        <div class="form-row">
          <label for="newName">Nombre</label>
          <input type="text" id="newName" required>
        </div>
        <div class="form-row">
          <label for="newPrice">Precio</label>
          <input type="number" id="newPrice" min="0" step="0.01" required>
        </div>
        <button type="submit" class="btn">Crear</button>
        <div id="prodMsg" class="msg" role="alert"></div>
      </form>
    </div>

    <div class="card">
      <h3>Menú actual</h3>
      <ul id="listaMenu"></ul>
    </div>
  </main>

  <script type="module" src="js/admin-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoApp - Tomar Pedido</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">RestoApp</span>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="pedido.html">Tomar pedido</a>
        <a href="admin.html">Admin</a>
        <a href="login.html">Iniciar sesión</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h2>Tomar pedido</h2>

    <form id="pedidoForm" class="card">
      <div class="form-row">
        <label for="plato">Plato</label>
        <select id="plato" required>
          <option value="">--Cargando menú--</option>
        </select>
      </div>
      <div class="form-row">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" min="1" step="1" required>
      </div>
      <div class="form-row">
        <label for="precio">Precio unitario ($)</label>
        <input type="number" id="precio" min="0" step="0.01" required>
      </div>
      <button type="submit" class="btn">Procesar pedido</button>
      <div id="mensaje" class="msg" role="alert"></div>
    </form>

    <div id="resultado" class="resultado"></div>
  </main>

  <script type="module" src="js/pedido-page.js"></script>
</body>
</html>
